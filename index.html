<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venta Catalog Studio</title><style>body{margin:0;background:#0b0b0b;color:#eee;font:13px Arial}button,input,select{font:inherit}.top{height:58px;background:#121212;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 18px;gap:10px}.brand{font:20px Georgia}.brand span{color:#9d8456}.top button,.btn{border:1px solid #383838;background:#1a1a1a;color:#ddd;border-radius:6px;padding:8px 12px}.right{margin-left:auto}.layout{display:grid;grid-template-columns:250px 1fr 310px;height:calc(100vh - 58px)}aside{background:#111;border-right:1px solid #292929;padding:16px;overflow:auto}.rightbar{border-left:1px solid #292929;border-right:0}.stage{display:flex;align-items:center;justify-content:center;background:#070707}.book{width:min(850px,88%);aspect-ratio:1.48;background:#faf9f6;color:#222;box-shadow:0 20px 70px #000;display:grid;grid-template-columns:1fr 1fr;position:relative}.page{padding:30px;position:relative}.left{background:linear-gradient(135deg,#fff,#eee8df)}.hero{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.hero h1{font:42px Georgia;margin:10px}.hero p{color:#806b49;letter-spacing:.2em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.prod{background:#fff;border:1px solid #ddd;padding:9px;text-align:center}.img,.pic{height:120px;background:radial-gradient(circle,#fff 25%,#e2dbd1);display:flex;align-items:center;justify-content:center;color:#b79a69;font:34px Georgia}.prod b{display:block;font-size:11px;margin-top:6px}.prod small,.item small{color:#777}.section{margin-bottom:20px}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#999}.search,.field input,.field select{width:100%;background:#191919;color:#ddd;border:1px solid #303030;border-radius:6px;padding:9px}.cat{width:100%;display:flex;justify-content:space-between;background:#171717;border:1px solid #292929;color:#bbb;border-radius:6px;padding:9px;margin:4px 0;text-align:left}.cat.active{border-color:#9d8456;color:#fff;background:#252019}.count{color:#777}.item{display:flex;align-items:center;gap:8px;background:#171717;border:1px solid #292929;padding:7px;border-radius:6px;margin:5px 0}.thumb{width:40px;height:40px;background:#eee;color:#9d8456;display:flex;align-items:center;justify-content:center}.item div{min-width:0}.item b{font-size:10px;display:block}.item button{margin-left:auto;background:none;border:0;color:#999}.field{margin:9px 0}.field label{display:block;color:#777;font-size:10px;margin-bottom:4px}.gold{background:#9d8456!important;color:#111!important}.status{margin-top:12px;padding:9px;background:#171717;border:1px solid #292929;border-radius:6px;color:#9d8456}.drawer{position:fixed;right:0;top:58px;bottom:0;width:420px;max-width:94vw;background:#151515;border-left:1px solid #333;padding:15px;overflow:auto;transform:translateX(110%);transition:.2s;z-index:20}.drawer.open{transform:translateX(0)}.drawerGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#1d1d1d;border:1px solid #303030;border-radius:7px;overflow:hidden}.card .info{padding:8px}.card b{font-size:10px;display:block}.card small{display:block;color:#777;margin:4px 0}.card button{width:100%;padding:7px;border:0;border-radius:5px}.badge{position:absolute;top:18px;left:25px;color:#9d8456;font-size:9px;letter-spacing:.15em;text-transform:uppercase}.spine{position:absolute;left:50%;top:0;bottom:0;width:22px;transform:translateX(-50%);background:linear-gradient(90deg,#0000,#0002,#0000)}.nav{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#777}.empty{padding:15px;text-align:center;color:#666;border:1px dashed #333;border-radius:6px}</style></head><body><div class="top"><div class="brand">VENTA <span>CATALOG STUDIO</span></div><button onclick="newPage()">+ Sayfa</button><button onclick="duplicatePage()">Sayfayı Çoğalt</button><div class="right"><button>Preview</button><button class="gold">Yayınla</button></div></div><div class="layout"><aside><div class="section"><h3>Katalog</h3><div class="field"><label>Katalog adı</label><input value="Venta Jewelry — 2026 Collection"></div></div><div class="section"><h3>Sayfalar</h3><div id="pages"></div></div><div class="section"><h3>Şablonlar</h3><button class="cat" onclick="applyTemplate('hero')">Hero + Ürünler</button><button class="cat" onclick="applyTemplate('products')">4 Ürün Grid</button><button class="cat" onclick="applyTemplate('feature')">Feature + 3 Ürün</button></div></aside><main class="stage"><div class="book"><div class="page left"><div class="badge">Venta Jewelry</div><div class="hero"><div><p>2026 Collection</p><h1>TIMELESS<br>BRILLIANCE</h1><p>Fine Jewelry</p></div></div></div><div class="page"><div class="badge" id="catBadge">Pırlanta Yüzükler</div><div id="products" class="grid"></div></div><div class="spine"></div><div class="nav">‹ &nbsp; Sayfa <b id="pageNum">7</b> / 20 &nbsp; ›</div></div></main><aside class="rightbar"><div class="section"><h3>Shopify Kategorileri</h3><input id="catSearch" class="search" placeholder="Kategori ara..." oninput="renderCats()"><div id="cats"></div></div><div class="section"><h3>Bu Sayfanın Ürünleri</h3><div id="selected"></div><button class="btn gold" style="width:100%" onclick="openDrawer()">+ Ürün Seç</button></div><div class="section"><h3>Sayfa Ayarları</h3><div class="field"><label>Başlık</label><input value="Pırlanta Koleksiyonu"></div><div class="field"><label>Sayfa kategorisi</label><select id="pageCat" onchange="setCat(this.value)"></select></div><div class="status">● Draft · Shopify bağlantısı hazır</div></div></aside></div><div id="drawer" class="drawer"><div style="display:flex;justify-content:space-between"><b id="drawerTitle">Ürün Seç</b><button class="btn" onclick="closeDrawer()">×</button></div><p style="color:#777;font-size:10px">Seçilen kategori içinden ürün ekle</p><input id="prodSearch" class="search" placeholder="Ürün / SKU ara..." oninput="renderProductsList()"><div id="drawerGrid" class="drawerGrid" style="margin-top:10px"></div></div><script>const cats=[['Pırlanta Yüzükler',611],['Pırlanta Kolyeler',282],['Pırlanta Küpeler',208],['Pırlanta Bileklikler',110],['Baget Pırlanta Koleksiyonu',102],['Özel Tektaş Koleksiyonu',287],['Evlilik Teklifi Yüzükleri',253],['Premium Pırlanta Koleksiyonu',34],['Günlük Pırlantalar',194],['Erkek Koleksiyonu',48],['İnci Koleksiyonu',5]];const products=[['Zenith Pırlanta Tektaş Yüzük','VNT-001','₺48.900'],['Baget Pırlanta Yüzük','VNT-014','₺36.500'],['Oval Kesim Tektaş','VNT-028','₺62.900'],['Pırlanta Su Yolu Bileklik','VNT-041','₺79.900'],['Baget Pırlanta Kolye','VNT-052','₺41.900'],['Pırlanta Halka Küpe','VNT-067','₺28.900'],['Premium Pırlanta Yüzük','VNT-081','₺94.900'],['Minimal Pırlanta Kolye','VNT-093','₺24.900']];let activeCat=0,selected=[0,1,2],page=7;function renderCats(){let q=(document.getElementById('catSearch').value||'').toLowerCase();document.getElementById('cats').innerHTML=cats.map((c,i)=>c[0].toLowerCase().includes(q)?`<button class="cat ${i===activeCat?'active':''}" onclick="setCat(${i})"><span>${c[0]}</span><span class="count">${c[1]}</span></button>`:'').join('');document.getElementById('pageCat').innerHTML=cats.map((c,i)=>`<option value="${i}" ${i===activeCat?'selected':''}>${c[0]}</option>`).join('')}function setCat(i){activeCat=+i;document.getElementById('catBadge').textContent=cats[activeCat][0];renderCats();openDrawer()}function renderSelected(){document.getElementById('selected').innerHTML=selected.length?selected.map((i,n)=>{let p=products[i];return `<div class="item"><div class="thumb">◇</div><div><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small></div><button onclick="removeProduct(${n})">×</button></div>`}).join(''):'<div class="empty">Bu sayfada ürün yok</div>';document.getElementById('products').innerHTML=selected.slice(0,4).map(i=>`<div class="prod"><div class="img">◇</div><b>${products[i][0]}</b><small>${products[i][1]} · ${products[i][2]}</small></div>`).join('')}function renderProductsList(){let q=(document.getElementById('prodSearch').value||'').toLowerCase();document.getElementById('drawerGrid').innerHTML=products.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(q)).map((p,i)=>`<div class="card"><div class="pic">◇</div><div class="info"><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small><button onclick="addProduct(${i})">Sayfaya ekle</button></div></div>`).join('')}function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawerTitle').textContent=cats[activeCat][0];renderProductsList()}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function addProduct(i){if(!selected.includes(i))selected.push(i);renderSelected();closeDrawer()}function removeProduct(n){selected.splice(n,1);renderSelected()}function newPage(){page++;document.getElementById('pageNum').textContent=page;selected=[];renderSelected();renderPages()}function duplicatePage(){page++;document.getElementById('pageNum').textContent=page;renderPages()}function renderPages(){document.getElementById('pages').innerHTML=Array.from({length:Math.min(page,12)},(_,i)=>`<button class="cat ${i+1===page?'active':''}" onclick="goPage(${i+1})"><span>Sayfa ${i+1}</span><span class="count">${i%3===0?'Hero':'Products'}</span></button>`).join('')}function goPage(n){page=n;document.getElementById('pageNum').textContent=n;renderPages()}function applyTemplate(t){if(t==='products')selected=[0,1,2,3];else if(t==='feature')selected=[0,2,4];else selected=[0,1,2];renderSelected()}renderCats();renderSelected();renderPages();</script></body></html>
