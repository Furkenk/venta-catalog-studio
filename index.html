<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venta Catalog Studio</title><style>
:root{--bg:#0a0a0a;--panel:#111;--panel2:#171717;--line:#292929;--muted:#888;--gold:#b79a69;--paper:#f7f5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee;font:12px Inter,Arial,sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.top{height:56px;background:#101010;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 14px}.brand{font:18px Georgia;letter-spacing:.04em;margin-right:10px}.brand i{font-style:normal;color:var(--gold)}.tool{background:#191919;border:1px solid #303030;color:#bbb;border-radius:6px;padding:7px 10px}.tool:hover,.tool.on{color:#fff;background:#26221b;border-color:#66563e}.spacer{flex:1}.save{color:#8ec99c;font-size:10px;margin-right:7px}.publish{background:var(--gold);color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:600}.app{height:calc(100vh - 56px);display:grid;grid-template-columns:238px 1fr 318px}.leftbar,.rightbar{background:var(--panel);overflow:auto}.leftbar{border-right:1px solid var(--line);padding:12px}.rightbar{border-left:1px solid var(--line);padding:12px}.section{margin-bottom:18px}.section h3{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#777;margin:5px 0 9px}.search,input,select{width:100%;background:#191919;color:#ddd;border:1px solid #303030;border-radius:6px;padding:8px;outline:none}.search:focus,input:focus,select:focus{border-color:#6d5b40}.pages{display:grid;gap:6px}.pageRow{display:flex;gap:6px;align-items:center}.pageBtn{flex:1;display:flex;justify-content:space-between;align-items:center;background:#171717;border:1px solid #292929;color:#aaa;border-radius:6px;padding:8px;text-align:left}.pageBtn.active{border-color:#927851;background:#282219;color:#fff}.pageBtn small{color:#666}.dragDots{color:#555;cursor:grab}.mini{width:32px;height:40px;background:#eee;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:#888;font:10px Georgia;margin-right:7px}.rowAction{width:25px;height:25px;border:1px solid #292929;background:#171717;color:#777;border-radius:5px}.add{width:100%;padding:8px;border:1px dashed #3b3b3b;background:transparent;color:#aaa;border-radius:6px;margin-top:7px}.templates{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tpl{height:60px;background:#191919;border:1px solid #292929;color:#aaa;border-radius:6px;font-size:10px}.tpl:hover{border-color:#766145;color:#fff}.stage{background:#080808;position:relative;overflow:hidden}.stagebar{height:44px;border-bottom:1px solid #202020;display:flex;align-items:center;padding:0 10px;gap:6px}.stagebar .zoom{margin-left:auto;display:flex;gap:4px;align-items:center}.stagebar button{background:#151515;border:1px solid #292929;color:#999;border-radius:5px;padding:5px 8px}.stagebar span{color:#777;font-size:10px;min-width:42px;text-align:center}.canvasArea{height:calc(100% - 44px);overflow:auto;display:flex;align-items:center;justify-content:center;padding:45px}.canvas{width:900px;aspect-ratio:1.414;background:var(--paper);position:relative;box-shadow:0 25px 80px #000;transform-origin:center}.gridlines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#a8875b12 1px,transparent 1px),linear-gradient(90deg,#a8875b12 1px,transparent 1px);background-size:5% 5%;opacity:0}.gridlines.show{opacity:1}.safe{position:absolute;inset:5%;border:1px dashed #a8875b55;pointer-events:none;display:none}.safe.show{display:block}.el{position:absolute;user-select:none;cursor:move;min-width:12px;min-height:12px}.el.sel{outline:1px solid #a9875a;outline-offset:2px}.el.locked{cursor:not-allowed}.handle{display:none;position:absolute;width:7px;height:7px;background:#fff;border:1px solid #927851}.sel .handle{display:block}.hse{right:-4px;bottom:-4px;cursor:nwse-resize}.hs{right:-4px;top:50%;transform:translateY(-50%);cursor:ew-resize}.vs{left:50%;bottom:-4px;transform:translateX(-50%);cursor:ns-resize}.productVisual{height:100%;width:100%;background:radial-gradient(circle at 50% 44%,#fff 0,#eee7dd 55%,#d8cec0 100%);display:flex;align-items:center;justify-content:center;color:#b39a76;font:52px Georgia}.productVisual:after{content:'◇';filter:drop-shadow(0 7px 8px #8886)}.prodText{font-size:9px;color:#444;line-height:1.35;margin-top:4px}.textEl{font-family:Georgia,serif;color:#181818;font-size:26px;letter-spacing:.06em;white-space:nowrap}.lineEl{height:1px;background:#b79a69}.qrEl{width:42px;height:42px;background:repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 4px);border:3px solid #fff}.logoEl{font:18px Georgia;color:#151515}.rightTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}.tab{padding:7px;background:#171717;color:#777;border:1px solid #292929;border-radius:5px}.tab.active{color:#fff;border-color:#816b4b;background:#28221a}.field{margin:9px 0}.field label{display:block;color:#777;font-size:10px;margin-bottom:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;gap:7px;align-items:center;color:#aaa;font-size:11px;margin:8px 0}.check input{width:auto}.catList{max-height:245px;overflow:auto;margin-top:7px}.cat{width:100%;display:flex;justify-content:space-between;background:#171717;border:1px solid #292929;color:#aaa;border-radius:6px;padding:8px;margin:4px 0;text-align:left}.cat.active{border-color:#8c7552;background:#282219;color:#fff}.count{color:#666}.selectedProducts{max-height:210px;overflow:auto}.item{display:flex;align-items:center;gap:7px;background:#171717;border:1px solid #292929;border-radius:6px;padding:6px;margin:4px 0}.thumb{width:35px;height:35px;background:#eee;color:#b79a69;display:flex;align-items:center;justify-content:center;font:18px Georgia}.item main{min-width:0}.item b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:#777;font-size:9px}.item button{margin-left:auto;border:0;background:transparent;color:#777}.drawer{position:fixed;right:0;top:56px;bottom:0;width:460px;max-width:95vw;background:#141414;border-left:1px solid #333;z-index:50;transform:translateX(105%);transition:.2s;box-shadow:-25px 0 80px #000a;padding:14px}.drawer.open{transform:translateX(0)}.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.drawerGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;height:calc(100% - 95px);margin-top:9px}.card{background:#1b1b1b;border:1px solid #303030;border-radius:7px;overflow:hidden}.cardPic{height:130px;background:radial-gradient(circle,#fff,#ddd4c7);display:flex;align-items:center;justify-content:center;color:#b79a69;font:30px Georgia}.cardInfo{padding:8px}.cardInfo b{display:block;font-size:10px;line-height:1.3}.cardInfo small{display:block;color:#777;margin:4px 0}.cardInfo button{width:100%;border:0;border-radius:5px;padding:7px}.preview{position:fixed;inset:0;background:#050505;z-index:100;display:none;align-items:center;justify-content:center}.preview.open{display:flex}.book{width:min(92vw,1450px);height:min(82vh,820px);display:flex;perspective:1800px;box-shadow:0 30px 100px #000}.bookPage{flex:1;background:#f7f5f0;position:relative;overflow:hidden;color:#222}.bookPage.left{background:linear-gradient(135deg,#fff,#eee8df)}.bookPage .center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.bookPage h1{font:42px Georgia;letter-spacing:.06em}.bookPage p{color:#8c7350;letter-spacing:.18em}.close{position:fixed;right:20px;top:16px;background:#191919;border:1px solid #444;color:#ddd;border-radius:6px;padding:8px 12px}.pnav{position:fixed;top:50%;font-size:42px;background:transparent;border:0;color:#ddd}.pnav.l{left:18px}.pnav.r{right:18px}.previewInfo{position:fixed;bottom:15px;color:#777;font-size:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#eee;color:#111;padding:9px 14px;border-radius:6px;display:none;z-index:200}.toast.show{display:block}@media(max-width:1000px){.app{grid-template-columns:200px 1fr}.rightbar{display:none}.canvas{width:760px}.canvasArea{padding:25px}}@media(max-width:700px){.leftbar{display:none}.app{grid-template-columns:1fr}.canvas{width:94vw}.stagebar .advanced{display:none}}
</style></head><body>
<header class="top"><div class="brand">VENTA <i>CATALOG STUDIO</i></div><button class="tool" onclick="undo()">↶</button><button class="tool" onclick="redo()">↷</button><button class="tool" onclick="duplicateSelected()">⌘ D</button><button class="tool" onclick="deleteSelected()">Delete</button><div class="spacer"></div><span class="save" id="saveState">● Auto-saved</span><button class="tool" onclick="saveNow()">Save</button><button class="tool" onclick="openPreview()">Preview</button><button class="publish" onclick="publish()">Publish</button></header>
<div class="app"><aside class="leftbar"><div class="section"><h3>Catalog</h3><div class="field"><label>Catalog name</label><input id="catalogName" value="Venta Jewelry — 2026 Collection"></div></div><div class="section"><h3>Pages</h3><div class="pages" id="pages"></div><button class="add" onclick="newPage()">+ New Page</button></div><div class="section"><h3>Layouts</h3><div class="templates"><button class="tpl" onclick="applyTemplate('hero')">Hero + 3</button><button class="tpl" onclick="applyTemplate('grid')">4 Product Grid</button><button class="tpl" onclick="applyTemplate('editorial')">Editorial</button><button class="tpl" onclick="applyTemplate('blank')">Blank</button></div></div></aside>
<main class="stage"><div class="stagebar"><button onclick="toggleGrid()">Grid</button><button onclick="toggleSafe()">Safe Area</button><button class="advanced" onclick="alignSelected('left')">Align L</button><button class="advanced" onclick="alignSelected('center')">Center</button><button class="advanced" onclick="alignSelected('right')">Align R</button><div class="zoom"><button onclick="zoom(-10)">−</button><span id="zoomText">100%</span><button onclick="zoom(10)">+</button><button onclick="zoom(0)">Fit</button></div></div><div class="canvasArea" id="canvasArea"><div class="canvas" id="canvas"><div class="gridlines" id="gridlines"></div><div class="safe" id="safe"></div></div></div></main>
<aside class="rightbar"><div class="rightTabs"><button class="tab active" id="tabPage" onclick="tab('page')">Page</button><button class="tab" id="tabElement" onclick="tab('element')">Element</button><button class="tab" id="tabProducts" onclick="tab('products')">Products</button></div><div id="panelPage"><div class="section"><h3>Page</h3><div class="field"><label>Title</label><input id="pageTitle" value="Zenith Selection" oninput="page.title=this.value;renderPages();touch()"></div><div class="field"><label>Category</label><select id="pageCategory"></select></div><div class="two"><div class="field"><label>Page</label><input id="pageNumber" type="number" min="1" value="1"></div><div class="field"><label>Background</label><select><option>Warm White</option><option>Pure White</option><option>Black</option></select></div></div></div><div class="section"><h3>Category</h3><input class="search" id="catSearch" placeholder="Search collection..." oninput="renderCats()"><div class="catList" id="cats"></div></div></div><div id="panelElement" style="display:none"><div id="elementEmpty" style="color:#666;padding:20px;text-align:center">Select an element on the canvas.</div><div id="elementForm" style="display:none"><div class="section"><h3>Position & Size</h3><div class="two"><div class="field"><label>X %</label><input id="ex" type="number"></div><div class="field"><label>Y %</label><input id="ey" type="number"></div><div class="field"><label>Width %</label><input id="ew" type="number"></div><div class="field"><label>Height %</label><input id="eh" type="number"></div></div><div class="field"><label>Rotation</label><input id="er" type="number"></div></div><div class="section"><h3>Content</h3><div class="field"><label>Text / Catalog Override</label><input id="et"></div><label class="check"><input id="elock" type="checkbox"> Lock element</label><button class="tool" style="width:100%" onclick="applyElement()">Apply Changes</button></div></div></div></div><div id="panelProducts" style="display:none"><div class="section"><h3>Page Products</h3><div id="selectedProducts" class="selectedProducts"></div><button class="publish" style="width:100%;margin-top:6px" onclick="openDrawer()">+ Select Products</button></div></div></aside></div>
<div class="drawer" id="drawer"><div class="drawerHead"><div><b id="drawerTitle">Select Products</b><div style="color:#777;font-size:10px;margin-top:3px">Shopify collection → product picker</div></div><button class="tool" onclick="closeDrawer()">×</button></div><input class="search" id="productSearch" placeholder="Search SKU or product..." oninput="renderProductDrawer()"><div class="drawerGrid" id="drawerGrid"></div></div>
<div class="preview" id="preview"><button class="close" onclick="closePreview()">Close</button><button class="pnav l" onclick="previewPrev()">‹</button><div class="book"><div class="bookPage left"><div class="center"><div><p>VENTA JEWELRY</p><h1>TIMELESS<br>BRILLIANCE</h1><p>2026 COLLECTION</p></div></div></div><div class="bookPage"><div id="previewProducts" style="padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:20px"></div></div></div><button class="pnav r" onclick="previewNext()">›</button><div class="previewInfo" id="previewInfo">6–7 / 20</div></div><div class="toast" id="toast"></div>
<script>
const collections=[['Pırlanta Yüzükler',611],['Pırlanta Kolyeler',282],['Pırlanta Küpeler',208],['Pırlanta Bileklikler',110],['Baget Pırlanta Koleksiyonu',102],['Özel Tektaş Koleksiyonu',287],['Evlilik Teklifi Yüzükleri',253],['Premium Pırlanta Koleksiyonu',34],['Günlük Pırlantalar',194],['Erkek Koleksiyonu',48],['İnci Koleksiyonu',5]];
const products=[['Zenith Pırlanta Tektaş Yüzük','VNT-001','0.64 ct'],['Baget Pırlanta Yüzük','VNT-014','0.52 ct'],['Oval Kesim Tektaş','VNT-028','0.71 ct'],['Pırlanta Su Yolu Bileklik','VNT-041','2.10 ct'],['Baget Pırlanta Kolye','VNT-052','0.48 ct'],['Pırlanta Halka Küpe','VNT-067','0.36 ct'],['Premium Pırlanta Yüzük','VNT-081','1.02 ct'],['Minimal Pırlanta Kolye','VNT-093','0.22 ct']];
let pages=[{title:'Kapak',cat:0,els:[]},{title:'Zenith Selection',cat:0,els:[]}],pi=1,sel=null,history=[],future=[],scale=1,previewPage=1;
function snapshot(){return JSON.stringify({pages,pi})}function touch(){history.push(snapshot());if(history.length>30)history.shift();future=[];localStorage.setItem('ventaCatalogDraft',snapshot());document.getElementById('saveState').textContent='● Auto-saved'}function saveNow(){localStorage.setItem('ventaCatalogDraft',snapshot());toast('Draft saved')}function undo(){if(!history.length)return;future.push(snapshot());let s=JSON.parse(history.pop());pages=s.pages;pi=s.pi;renderAll()}function redo(){if(!future.length)return;history.push(snapshot());let s=JSON.parse(future.pop());pages=s.pages;pi=s.pi;renderAll()}
function current(){return pages[pi]}function renderAll(){page=current();document.getElementById('pageTitle').value=page.title;document.getElementById('pageNumber').value=pi+1;renderPages();renderCats();renderCategorySelect();renderCanvas();renderSelectedProducts();if(sel)selectElement(sel)}
function renderPages(){document.getElementById('pages').innerHTML=pages.map((p,i)=>`<div class="pageRow"><span class="dragDots">⋮⋮</span><button class="pageBtn ${i===pi?'active':''}" onclick="goPage(${i})"><span><span class="mini">${String(i+1).padStart(2,'0')}</span>${p.title}</span><small>${i+1}</small></button><button class="rowAction" onclick="duplicatePage(${i})">+</button></div>`).join('')}
function goPage(i){pi=i;sel=null;renderAll()}
function newPage(){history.push(snapshot());pages.splice(pi+1,0,{title:'New Page',cat:0,els:[]});pi++;touch();renderAll()}
function duplicatePage(i=pi){history.push(snapshot());pages.splice(i+1,0',pages[i] ? JSON.parse(JSON.stringify(pages[i])) : {title:'Copy',cat:0,els:[]});pi=i+1;touch();renderAll()}
function deletePage(){if(pages.length<=1)return toast('At least one page is required');history.push(snapshot());pages.splice(pi,1);pi=Math.max(0,pi-1);touch();renderAll()}
function renderCategorySelect(){document.getElementById('pageCategory').innerHTML=collections.map((c,i)=>`<option value="${i}" ${i===page.cat?'selected':''}>${c[0]}</option>`).join('');document.getElementById('pageCategory').onchange=e=>{page.cat=+e.target.value;touch();renderCats();renderCanvas()}}
function renderCats(){let q=(document.getElementById('catSearch').value||'').toLowerCase();document.getElementById('cats').innerHTML=collections.map((c,i)=>c[0].toLowerCase().includes(q)?`<button class="cat ${i===page.cat?'active':''}" onclick="setCategory(${i})"><span>${c[0]}</span><span class="count">${c[1]}</span></button>`:'').join('')}
function setCategory(i){history.push(snapshot());page.cat=i;touch();renderAll();openDrawer()}
function elBase(type,x,y,w,h){return {id:crypto.randomUUID(),type,x,y,w,h,r:0,locked:false,text:type==='text'?'NEW TITLE':''}}
function renderCanvas(){const c=document.getElementById('canvas');c.querySelectorAll('.el').forEach(e=>e.remove());page.els.forEach(e=>{let d=document.createElement('div');d.className='el '+(e.id===sel?'sel ':'')+(e.locked?'locked':'');d.dataset.id=e.id;d.style.left=e.x+'%';d.style.top=e.y+'%';d.style.width=e.w+'%';d.style.height=e.h+'%';d.style.transform=`rotate(${e.r}deg)`;if(e.type==='product'){d.innerHTML=`<div class="productVisual"></div><div class="prodText"><b>${products[e.product]?.[0]||'Product'}</b><br>${products[e.product]?.[1]||''} · ${products[e.product]?.[2]||''}</div>`}else if(e.type==='text'){d.classList.add('textEl');d.textContent=e.text}else if(e.type==='qr')d.className+=' qrEl';else if(e.type==='line')d.className+=' lineEl';else if(e.type==='logo')d.className+=' logoEl',d.textContent='VENTA';d.innerHTML+=`<i class="handle hse"></i><i class="handle hs"></i><i class="handle vs"></i>`;c.appendChild(d);bindElement(d,e)});}
function bindElement(d,e){d.addEventListener('mousedown',ev=>{if(ev.target.classList.contains('handle'))return;if(e.locked)return;selectElement(e.id);let sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y;function move(a){let r=cRect(),dx=(a.clientX-sx)/r.width*100,dy=(a.clientY-sy)/r.height*100;e.x=Math.max(0,Math.min(100-e.w,ox+dx));e.y=Math.max(0,Math.min(100-e.h,oy+dy));renderCanvas();selectElement(e.id)}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);touch()}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);ev.preventDefault()});d.addEventListener('click',ev=>{ev.stopPropagation();selectElement(e.id)});d.querySelector('.hse').onmousedown=ev=>resize(ev,e,'se');d.querySelector('.hs').onmousedown=ev=>resize(ev,e,'e');d.querySelector('.vs').onmousedown=ev=>resize(ev,e,'s')}
function cRect(){return document.getElementById('canvas').getBoundingClientRect()}function resize(ev,e,dir){ev.stopPropagation();let sx=ev.clientX,sy=ev.clientY,ow=e.w,oh=e.h;function move(a){let r=cRect();if(dir.includes('e'))e.w=Math.max(2,Math.min(100-e.x,ow+(a.clientX-sx)/r.width*100));if(dir.includes('s'))e.h=Math.max(2,Math.min(100-e.y,oh+(a.clientY-sy)/r.height*100));renderCanvas();selectElement(e.id)}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);touch()}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)}
function selectElement(id){sel=typeof id==='string'?id:id.id;document.querySelectorAll('.el').forEach(x=>x.classList.toggle('sel',x.dataset.id===sel));let e=page.els.find(x=>x.id===sel);if(e){tab('element');document.getElementById('elementEmpty').style.display='none';document.getElementById('elementForm').style.display='block';ex.value=Math.round(e.x);ey.value=Math.round(e.y);ew.value=Math.round(e.w);eh.value=Math.round(e.h);er.value=e.r;et.value=e.text||'';elock.checked=e.locked}}
function applyElement(){let e=page.els.find(x=>x.id===sel);if(!e)return;e.x=+ex.value;e.y=+ey.value;e.w=+ew.value;e.h=+eh.value;e.r=+er.value;e.text=et.value;e.locked=elock.checked;touch();renderCanvas();selectElement(e.id)}
function addEl(type,extra={}){history.push(snapshot());let e=elBase(type,10+Math.random()*35,10+Math.random()*35, type==='text'?25:18,type==='text'?8:18);Object.assign(e,extra);page.els.push(e);sel=e.id;touch();renderCanvas();selectElement(e.id)}
function deleteSelected(){if(!sel)return;history.push(snapshot());page.els=page.els.filter(e=>e.id!==sel);sel=null;touch();renderCanvas();tab('page')}
function duplicateSelected(){let e=page.els.find(x=>x.id===sel);if(!e)return;history.push(snapshot());let n=JSON.parse(JSON.stringify(e));n.id=crypto.randomUUID();n.x=Math.min(100-n.w,e.x+4);n.y=Math.min(100-n.h,e.y+4);page.els.push(n);sel=n.id;touch();renderCanvas();selectElement(n.id)}
function alignSelected(where){let e=page.els.find(x=>x.id===sel);if(!e)return;if(where==='left')e.x=5;if(where==='right')e.x=95-e.w;if(where==='center')e.x=(100-e.w)/2;touch();renderCanvas();selectElement(e.id)}
function applyTemplate(t){history.push(snapshot());page.els=[];if(t==='hero'){page.els.push(elBase('text',8,8,45,12),elBase('product',55,12,25,30,{product:0}),elBase('product',55,52,25,30,{product:1}),elBase('product',28,62,20,26,{product:2}))}else if(t==='grid'){[0,1,2,3].forEach((p,i)=>page.els.push(elBase('product',8+(i%2)*45,12+Math.floor(i/2)*42,38,32,{product:p})))}else if(t==='editorial'){page.els.push(elBase('product',6,7,52,78,{product:0}),elBase('text',63,16,30,10,{text:'THE ZENITH EDIT'}),elBase('text',63,33,25,14,{text:'Timeless\nBrilliance'}),elBase('qr',63,62,8,8),elBase('logo',63,80,20,8))}touch();renderCanvas()}
function renderSelectedProducts(){let ids=page.els.filter(e=>e.type==='product').map(e=>e.product);document.getElementById('selectedProducts').innerHTML=ids.length?ids.map((p,n)=>`<div class="item"><div class="thumb">◇</div><main><b>${products[p]?.[0]}</b><small>${products[p]?.[1]} · ${products[p]?.[2]}</small></main><button onclick="removePageProduct(${n})">×</button></div>`).join(''):'<div style="color:#666;padding:10px">No products on this page.</div>'}
function removePageProduct(n){let ids=page.els.filter(e=>e.type==='product');let id=ids[n]?.id;if(id){history.push(snapshot());page.els=page.els.filter(e=>e.id!==id);touch();renderAll()}}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawerTitle').textContent=collections[page.cat][0];renderProductDrawer()}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function renderProductDrawer(){let q=(document.getElementById('productSearch').value||'').toLowerCase();document.getElementById('drawerGrid').innerHTML=products.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(q)).map((p,i)=>`<div class="card"><div class="cardPic">◇</div><div class="cardInfo"><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small><button onclick="addProductToPage(${i})">Add to page</button></div></div>`).join('')}
function addProductToPage(i){history.push(snapshot());page.els.push(elBase('product',8+(page.els.filter(e=>e.type==='product').length%2)*45,10+(Math.floor(page.els.filter(e=>e.type==='product').length/2)%3)*28,38,23,{product:i}));touch();renderAll();closeDrawer();tab('products')}
function tab(t){['page','element','products'].forEach(x=>{document.getElementById('panel'+x[0].toUpperCase()+x.slice(1)).style.display=x===t?'block':'none';document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t)})}
function toggleGrid(){document.getElementById('gridlines').classList.toggle('show')}function toggleSafe(){document.getElementById('safe').classList.toggle('show')}function zoom(n){if(n===0)scale=1;else scale=Math.max(.6,Math.min(1.4,scale+n/100));document.getElementById('canvas').style.transform=`scale(${scale})`;document.getElementById('zoomText').textContent=Math.round(scale*100)+'%'}
function openPreview(){previewPage=pi;renderPreview();document.getElementById('preview').classList.add('open')}function closePreview(){document.getElementById('preview').classList.remove('open')}function renderPreview(){let p=pages[previewPage],ids=p.els.filter(e=>e.type==='product').slice(0,4);document.getElementById('previewProducts').innerHTML=ids.map(e=>`<div style="text-align:center"><div style="height:220px;background:radial-gradient(circle,#fff,#e1d9ce);display:flex;align-items:center;justify-content:center;font:60px Georgia;color:#b79a69">◇</div><div style="font:12px Georgia;margin-top:8px">${products[e.product]?.[0]||'Product'}</div><small>${products[e.product]?.[1]||''}</small></div>`).join('');document.getElementById('previewInfo').textContent=(previewPage*2+1)+'–'+(previewPage*2+2)+' / '+(pages.length*2)}function previewNext(){previewPage=Math.min(pages.length-1,previewPage+1);renderPreview()}function previewPrev(){previewPage=Math.max(0,previewPage-1);renderPreview()}
function publish(){saveNow();toast('Draft ready. Production publish will be enabled after backend + Shopify connection.')}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}else if(e.key==='Delete')deleteSelected()});document.getElementById('canvas').addEventListener('click',()=>{sel=null;renderCanvas()});
let page=pages[pi];renderAll();applyTemplate('hero');
