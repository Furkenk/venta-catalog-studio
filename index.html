<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venta Catalog Studio</title><style>:root{--bg:#0b0b0b;--p:#121212;--line:#292929;--gold:#b79a69;--paper:#f7f5f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee;font:12px Arial;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.top{height:56px;background:#101010;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 14px}.brand{font:18px Georgia;margin-right:10px}.brand i{color:var(--gold);font-style:normal}.sp{flex:1}.btn{background:#191919;color:#bbb;border:1px solid #333;border-radius:6px;padding:7px 10px}.gold{background:var(--gold);color:#111;border:0;border-radius:6px;padding:8px 14px}.save{color:#8fc79b;font-size:10px}.app{height:calc(100vh - 56px);display:grid;grid-template-columns:240px 1fr 320px}.side{background:var(--p);padding:12px;overflow:auto;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.sec{margin-bottom:18px}.sec h3{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#777;margin:5px 0 9px}.input,input,select{width:100%;background:#191919;color:#ddd;border:1px solid #303030;border-radius:6px;padding:8px}.pages{display:grid;gap:5px}.prow{display:flex;gap:5px}.page{flex:1;text-align:left;background:#171717;color:#aaa;border:1px solid #292929;border-radius:6px;padding:8px}.page.active{background:#282219;border-color:#927851;color:#fff}.mini{display:inline-flex;width:28px;height:34px;background:#eee;color:#888;align-items:center;justify-content:center;font:10px Georgia;margin-right:7px;border-radius:2px}.smallbtn{width:26px;background:#171717;color:#777;border:1px solid #292929;border-radius:5px}.add{width:100%;background:transparent;border:1px dashed #444;color:#aaa;padding:8px;border-radius:6px;margin-top:7px}.templates{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tpl{height:55px;background:#191919;color:#aaa;border:1px solid #292929;border-radius:6px}.stage{background:#080808;position:relative}.stagebar{height:44px;border-bottom:1px solid #222;display:flex;align-items:center;gap:6px;padding:0 10px}.zoom{margin-left:auto;display:flex;gap:4px;align-items:center}.zoom span{color:#777;width:40px;text-align:center}.canvasArea{height:calc(100% - 44px);display:flex;align-items:center;justify-content:center;overflow:auto;padding:35px}.canvas{width:900px;aspect-ratio:1.414;background:var(--paper);position:relative;box-shadow:0 25px 80px #000;transform-origin:center}.gridlines{position:absolute;inset:0;pointer-events:none;opacity:0;background-image:linear-gradient(#a8875b18 1px,transparent 1px),linear-gradient(90deg,#a8875b18 1px,transparent 1px);background-size:5% 5%}.gridlines.show{opacity:1}.safe{position:absolute;inset:5%;border:1px dashed #a8875b55;display:none;pointer-events:none}.safe.show{display:block}.el{position:absolute;cursor:move;user-select:none;min-width:12px;min-height:12px}.el.sel{outline:1px solid #a9875a;outline-offset:2px}.handle{display:none;position:absolute;width:7px;height:7px;background:#fff;border:1px solid #927851}.sel .handle{display:block}.se{right:-4px;bottom:-4px;cursor:nwse-resize}.product{width:100%;height:100%;background:radial-gradient(circle,#fff,#e5ddd2);display:flex;align-items:center;justify-content:center;color:#b79a69;font:52px Georgia}.product:before{content:'◇'}.ptext{font-size:9px;color:#444;line-height:1.3}.text{font:26px Georgia;color:#171717;white-space:pre-line}.qr{background:repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 4px);border:3px solid white}.logo{font:18px Georgia;color:#151515}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}.tab{padding:7px;background:#171717;color:#777;border:1px solid #292929;border-radius:5px}.tab.active{color:#fff;border-color:#816b4b;background:#282219}.field{margin:8px 0}.field label{display:block;color:#777;font-size:10px;margin-bottom:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cats{max-height:260px;overflow:auto}.cat{width:100%;display:flex;justify-content:space-between;background:#171717;color:#aaa;border:1px solid #292929;border-radius:6px;padding:8px;margin:4px 0;text-align:left}.cat.active{background:#282219;border-color:#927851;color:#fff}.count{color:#666}.items{max-height:220px;overflow:auto}.item{display:flex;align-items:center;gap:7px;background:#171717;border:1px solid #292929;border-radius:6px;padding:6px;margin:4px 0}.thumb{width:34px;height:34px;background:#eee;color:#b79a69;display:flex;align-items:center;justify-content:center;font:18px Georgia}.item main{min-width:0}.item b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:#777;font-size:9px}.item button{margin-left:auto;background:transparent;border:0;color:#777}.drawer{position:fixed;top:56px;right:0;bottom:0;width:450px;max-width:94vw;background:#151515;border-left:1px solid #333;z-index:50;transform:translateX(105%);transition:.2s;padding:14px}.drawer.open{transform:translateX(0)}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:calc(100% - 85px);overflow:auto;margin-top:9px}.card{background:#1d1d1d;border:1px solid #303030;border-radius:7px;overflow:hidden}.pic{height:125px;background:radial-gradient(circle,#fff,#ddd4c7);display:flex;align-items:center;justify-content:center;color:#b79a69;font:30px Georgia}.info{padding:8px}.info b{font-size:10px;display:block}.info small{display:block;color:#777;margin:4px 0}.info button{width:100%;padding:7px;border:0;border-radius:5px}.preview{position:fixed;inset:0;background:#050505;z-index:100;display:none;align-items:center;justify-content:center}.preview.open{display:flex}.book{width:min(92vw,1450px);height:min(82vh,820px);display:flex;box-shadow:0 30px 100px #000}.bookpg{flex:1;background:#f7f5f0;color:#222;padding:40px;position:relative}.bookpg.left{background:linear-gradient(135deg,#fff,#eee8df);display:flex;align-items:center;justify-content:center;text-align:center}.bookpg h1{font:42px Georgia}.close{position:fixed;right:20px;top:16px;background:#191919;color:#ddd;border:1px solid #444;border-radius:6px;padding:8px}.pn{position:fixed;top:50%;background:transparent;border:0;color:#ddd;font-size:42px}.pl{left:18px}.pr{right:18px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#eee;color:#111;padding:9px 14px;border-radius:6px;display:none;z-index:200}.toast.on{display:block}@media(max-width:950px){.app{grid-template-columns:200px 1fr}.right{display:none}.canvas{width:760px}}@media(max-width:650px){.side{display:none}.app{grid-template-columns:1fr}.canvas{width:94vw}.stagebar .adv{display:none}}</style></head><body>
<header class="top"><div class="brand">VENTA <i>CATALOG STUDIO</i></div><button class="btn" onclick="undo()">↶</button><button class="btn" onclick="redo()">↷</button><button class="btn" onclick="dupEl()">⌘D</button><button class="btn" onclick="delEl()">Delete</button><div class="sp"></div><span class="save" id="save">● Auto-saved</span><button class="btn" onclick="save()">Save</button><button class="btn" onclick="openPreview()">Preview</button><button class="gold" onclick="publish()">Publish</button></header>
<div class="app"><aside class="side"><div class="sec"><h3>Catalog</h3><div class="field"><label>Name</label><input id="catName" value="Venta Jewelry — 2026 Collection"></div></div><div class="sec"><h3>Pages</h3><div id="pages" class="pages"></div><button class="add" onclick="newPage()">+ New Page</button></div><div class="sec"><h3>Layouts</h3><div class="templates"><button class="tpl" onclick="template('hero')">Hero + 3</button><button class="tpl" onclick="template('grid')">4 Products</button><button class="tpl" onclick="template('editorial')">Editorial</button><button class="tpl" onclick="template('blank')">Blank</button></div></div></aside>
<main class="stage"><div class="stagebar"><button class="btn" onclick="grid()">Grid</button><button class="btn" onclick="safe()">Safe Area</button><button class="btn adv" onclick="align('left')">Align L</button><button class="btn adv" onclick="align('center')">Center</button><button class="btn adv" onclick="align('right')">Align R</button><div class="zoom"><button class="btn" onclick="zoom(-10)">−</button><span id="z">100%</span><button class="btn" onclick="zoom(10)">+</button><button class="btn" onclick="zoom(0)">Fit</button></div></div><div class="canvasArea"><div class="canvas" id="canvas"><div class="gridlines" id="gl"></div><div class="safe" id="sa"></div></div></div></main>
<aside class="side right"><div class="tabs"><button id="tp" class="tab active" onclick="tab('page')">Page</button><button id="te" class="tab" onclick="tab('element')">Element</button><button id="tpr" class="tab" onclick="tab('products')">Products</button></div><div id="pp"><div class="sec"><h3>Page</h3><div class="field"><label>Title</label><input id="pt" oninput="page.title=this.value;renderPages();touch()"></div><div class="field"><label>Category</label><select id="pc"></select></div></div><div class="sec"><h3>Shopify Categories</h3><input id="cs" placeholder="Search collection..." oninput="renderCats()"><div class="cats" id="cats"></div></div></div><div id="pe" style="display:none"><div id="empty" style="padding:20px;color:#666">Select an element on canvas.</div><div id="ef" style="display:none"><div class="sec"><h3>Position</h3><div class="two"><div class="field"><label>X %</label><input id="ex" type="number"></div><div class="field"><label>Y %</label><input id="ey" type="number"></div><div class="field"><label>W %</label><input id="ew" type="number"></div><div class="field"><label>H %</label><input id="eh" type="number"></div></div><div class="field"><label>Rotation</label><input id="er" type="number"></div></div><div class="sec"><h3>Content</h3><div class="field"><label>Catalog Override</label><input id="et"></div><label style="color:#aaa"><input id="lock" type="checkbox"> Lock</label><button class="btn" style="width:100%;margin-top:8px" onclick="applyEl()">Apply</button></div></div></div><div id="ppro" style="display:none"><div class="sec"><h3>Page Products</h3><div id="items" class="items"></div><button class="gold" style="width:100%;margin-top:7px" onclick="openDrawer()">+ Select Products</button></div></div></aside></div>
<div id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><div><b id="dt">Select Products</b><div style="color:#777;font-size:10px">Shopify collection product picker</div></div><button class="btn" onclick="closeDrawer()">×</button></div><input id="ps" style="margin-top:10px" placeholder="Search SKU or product..." oninput="renderDrawer()"><div id="dg" class="dgrid"></div></div>
<div id="preview" class="preview"><button class="close" onclick="closePreview()">Close</button><button class="pn pl" onclick="prevPrev()">‹</button><div class="book"><div class="bookpg left"><div><p style="color:#8c7350;letter-spacing:.2em">VENTA JEWELRY</p><h1>TIMELESS<br>BRILLIANCE</h1><p style="color:#8c7350;letter-spacing:.2em">2026 COLLECTION</p></div></div><div class="bookpg"><div id="pv" style="display:grid;grid-template-columns:1fr 1fr;gap:20px"></div></div></div><button class="pn pr" onclick="nextPrev()">›</button><div style="position:fixed;bottom:15px;color:#777" id="pi">1 / 2</div></div><div id="toast" class="toast"></div>
<script>
const cats=[['Pırlanta Yüzükler',611],['Pırlanta Kolyeler',282],['Pırlanta Küpeler',208],['Pırlanta Bileklikler',110],['Baget Pırlanta Koleksiyonu',102],['Özel Tektaş Koleksiyonu',287],['Evlilik Teklifi Yüzükleri',253],['Premium Pırlanta Koleksiyonu',34],['Günlük Pırlantalar',194],['Erkek Koleksiyonu',48],['İnci Koleksiyonu',5]];
const products=[['Zenith Pırlanta Tektaş Yüzük','VNT-001','0.64 ct'],['Baget Pırlanta Yüzük','VNT-014','0.52 ct'],['Oval Kesim Tektaş','VNT-028','0.71 ct'],['Pırlanta Su Yolu Bileklik','VNT-041','2.10 ct'],['Baget Pırlanta Kolye','VNT-052','0.48 ct'],['Pırlanta Halka Küpe','VNT-067','0.36 ct'],['Premium Pırlanta Yüzük','VNT-081','1.02 ct'],['Minimal Pırlanta Kolye','VNT-093','0.22 ct']];
let pages=[{title:'Kapak',cat:0,els:[]},{title:'Zenith Selection',cat:0,els:[]}],pi=1,sel=null,history=[],future=[],scale=1,previewPage=1,page=pages[1];
const snap=()=>JSON.stringify({pages,pi});function touch(){localStorage.setItem('ventaCatalogDraft',snap());document.getElementById('save').textContent='● Auto-saved'}function save(){localStorage.setItem('ventaCatalogDraft',snap());toast('Draft saved')}function undo(){if(!history.length)return;future.push(snap());let s=JSON.parse(history.pop());pages=s.pages;pi=s.pi;page=pages[pi];renderAll()}function redo(){if(!future.length)return;history.push(snap());let s=JSON.parse(future.pop());pages=s.pages;pi=s.pi;page=pages[pi];renderAll()}function checkpoint(){history.push(snap());if(history.length>30)history.shift();future=[]}
function renderAll(){page=pages[pi];pt.value=page.title;renderPages();renderCats();pc.innerHTML=cats.map((c,i)=>`<option value="${i}" ${i===page.cat?'selected':''}>${c[0]}</option>`).join('');renderCanvas();renderItems()}function renderPages(){pagesEl.innerHTML=pages.map((p,i)=>`<div class="prow"><button class="page ${i===pi?'active':''}" onclick="go(${i})"><span><span class="mini">${String(i+1).padStart(2,'0')}</span>${p.title}</span>${i+1}</button><button class="smallbtn" onclick="duplicatePage(${i})">+</button></div>`).join('')}
function go(i){pi=i;sel=null;renderAll()}function newPage(){checkpoint();pages.splice(pi+1,0,{title:'New Page',cat:0,els:[]});pi++;touch();renderAll()}function duplicatePage(i){checkpoint();pages.splice(i+1,0,JSON.parse(JSON.stringify(pages[i])));pi=i+1;touch();renderAll()}function renderCats(){let q=(cs.value||'').toLowerCase();catsEl=document.getElementById('cats');catsEl.innerHTML=cats.map((c,i)=>c[0].toLowerCase().includes(q)?`<button class="cat ${i===page.cat?'active':''}" onclick="setCat(${i})"><span>${c[0]}</span><span class="count">${c[1]}</span></button>`:'').join('')}function setCat(i){checkpoint();page.cat=i;touch();renderAll();openDrawer()}
pc.onchange=e=>{checkpoint();page.cat=+e.target.value;touch();renderAll()}
function base(type,x=10,y=10,w=20,h=20,o={}){return Object.assign({id:crypto.randomUUID(),type,x,y,w,h,r:0,locked:false,text:type==='text'?'NEW TITLE':''},o)}
function template(t){checkpoint();page.els=[];if(t==='hero'){page.els=[base('text',8,8,40,12,{text:'THE ZENITH EDIT'}),base('product',55,10,30,32,{product:0}),base('product',55,50,30,32,{product:1}),base('product',22,62,25,28,{product:2})]}else if(t==='grid'){[0,1,2,3].forEach((p,i)=>page.els.push(base('product',7+(i%2)*47,10+Math.floor(i/2)*43,40,33,{product:p})))}else if(t==='editorial'){page.els=[base('product',6,7,52,80,{product:0}),base('text',64,14,28,12,{text:'TIMELESS\nBRILLIANCE'}),base('qr',64,60,8,8),base('logo',64,78,20,8)]}touch();renderAll()}
function renderCanvas(){canvas.querySelectorAll('.el').forEach(e=>e.remove());page.els.forEach(e=>{let d=document.createElement('div');d.className='el '+(e.id===sel?'sel ':'');d.dataset.id=e.id;d.style.left=e.x+'%';d.style.top=e.y+'%';d.style.width=e.w+'%';d.style.height=e.h+'%';d.style.transform=`rotate(${e.r}deg)`;if(e.type==='product'){d.innerHTML=`<div class="product"></div><div class="ptext"><b>${products[e.product]?.[0]||'Product'}</b><br>${products[e.product]?.[1]||''} · ${products[e.product]?.[2]||''}</div>`}else if(e.type==='text'){d.className+=' text';d.textContent=e.text}else if(e.type==='qr'){d.className+=' qr'}else if(e.type==='logo'){d.className+=' logo';d.textContent='VENTA'}d.innerHTML+=`<i class="handle se"></i>`;canvas.appendChild(d);bind(d,e)})}
function bind(d,e){d.addEventListener('click',ev=>{ev.stopPropagation();select(e.id)});d.addEventListener('mousedown',ev=>{if(e.locked||ev.target.classList.contains('handle'))return;select(e.id);let sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y,r=canvas.getBoundingClientRect();function mv(a){e.x=Math.max(0,Math.min(100-e.w,ox+(a.clientX-sx)/r.width*100));e.y=Math.max(0,Math.min(100-e.h,oy+(a.clientY-sy)/r.height*100));renderCanvas();select(e.id)}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);touch()}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);ev.preventDefault()});d.querySelector('.handle').onmousedown=ev=>resize(ev,e)}function resize(ev,e){ev.stopPropagation();let sx=ev.clientX,sy=ev.clientY,ow=e.w,oh=e.h,r=canvas.getBoundingClientRect();function mv(a){e.w=Math.max(2,Math.min(100-e.x,ow+(a.clientX-sx)/r.width*100));e.h=Math.max(2,Math.min(100-e.y,oh+(a.clientY-sy)/r.height*100));renderCanvas();select(e.id)}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);touch()}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)}
function select(id){sel=id;let e=page.els.find(x=>x.id===id);document.querySelectorAll('.el').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));if(!e)return;tab('element');ex.value=Math.round(e.x);ey.value=Math.round(e.y);ew.value=Math.round(e.w);eh.value=Math.round(e.h);er.value=e.r;et.value=e.text||'';lock.checked=e.locked;empty.style.display='none';ef.style.display='block'}function applyEl(){let e=page.els.find(x=>x.id===sel);if(!e)return;e.x=+ex.value;e.y=+ey.value;e.w=+ew.value;e.h=+eh.value;e.r=+er.value;e.text=et.value;e.locked=lock.checked;touch();renderCanvas();select(e.id)}function delEl(){if(!sel)return;checkpoint();page.els=page.els.filter(e=>e.id!==sel);sel=null;touch();renderCanvas();tab('page')}function dupEl(){let e=page.els.find(x=>x.id===sel);if(!e)return;checkpoint();let n=JSON.parse(JSON.stringify(e));n.id=crypto.randomUUID();n.x=Math.min(100-n.w,e.x+4);n.y=Math.min(100-n.h,e.y+4);page.els.push(n);sel=n.id;touch();renderCanvas();select(n.id)}function align(where){let e=page.els.find(x=>x.id===sel);if(!e)return;e.x=where==='left'?5:where==='right'?95-e.w:(100-e.w)/2;touch();renderCanvas();select(e.id)}
function renderItems(){let ids=page.els.filter(e=>e.type==='product');items.innerHTML=ids.length?ids.map((e,n)=>`<div class="item"><div class="thumb">◇</div><main><b>${products[e.product]?.[0]}</b><small>${products[e.product]?.[1]} · ${products[e.product]?.[2]}</small></main><button onclick="removeProduct(${n})">×</button></div>`).join(''):'<div style="color:#666;padding:10px">No products.</div>'}function removeProduct(n){let ids=page.els.filter(e=>e.type==='product');if(!ids[n])return;checkpoint();page.els=page.els.filter(e=>e.id!==ids[n].id);touch();renderAll()}
function openDrawer(){drawer.classList.add('open');dt.textContent=cats[page.cat][0];renderDrawer()}function closeDrawer(){drawer.classList.remove('open')}function renderDrawer(){let q=(ps.value||'').toLowerCase();dg.innerHTML=products.filter(p=>(p[0]+' '+p[1]).toLowerCase().includes(q)).map((p,i)=>`<div class="card"><div class="pic">◇</div><div class="info"><b>${p[0]}</b><small>${p[1]} · ${p[2]}</small><button onclick="addProduct(${i})">Add to page</button></div></div>`).join('')}function addProduct(i){checkpoint();let n=page.els.filter(e=>e.type==='product').length;page.els.push(base('product',7+(n%2)*47,10+(Math.floor(n/2)%3)*28,40,22,{product:i}));touch();renderAll();tab('products');closeDrawer()}
function tab(t){['page','element','products'].forEach(x=>{let id=x==='page'?'pp':x==='element'?'pe':'ppro';document.getElementById(id).style.display=x===t?'block':'none';document.getElementById('t'+(x==='page'?'p':x==='element'?'e':'pr')).classList.toggle('active',x===t)})}function grid(){gl.classList.toggle('show')}function safe(){sa.classList.toggle('show')}function zoom(n){scale=n===0?1:Math.max(.65,Math.min(1.4,scale+n/100));canvas.style.transform=`scale(${scale})`;z.textContent=Math.round(scale*100)+'%'}
function openPreview(){previewPage=pi;renderPreview();preview.classList.add('open')}function closePreview(){preview.classList.remove('open')}function renderPreview(){let ids=pages[previewPage].els.filter(e=>e.type==='product').slice(0,4);pv.innerHTML=ids.map(e=>`<div style="text-align:center"><div style="height:220px;background:radial-gradient(circle,#fff,#e1d9ce);display:flex;align-items:center;justify-content:center;color:#b79a69;font:60px Georgia">◇</div><div style="font:12px Georgia;margin-top:8px">${products[e.product]?.[0]||'Product'}</div><small>${products[e.product]?.[1]||''}</small></div>`).join('');pi.textContent=(previewPage+1)+' / '+pages.length}function nextPrev(){previewPage=Math.min(pages.length-1,previewPage+1);renderPreview()}function prevPrev(){previewPage=Math.max(0,previewPage-1);renderPreview()}function publish(){save();toast('Draft saved. Production publish activates with backend.')}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z')undo();if((e.ctrlKey||e.metaKey)&&e.key==='y')redo();if(e.key==='Delete')delEl()});canvas.addEventListener('click',()=>{sel=null;renderCanvas()});renderAll();template('hero');
</script></body></html>
